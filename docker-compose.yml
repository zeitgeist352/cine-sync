version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: cinelog_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: cinelog
      MYSQL_USER: cinelog_user
      MYSQL_PASSWORD: cinelog_pass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 10s
      retries: 30

  backend:
    build: ./backend
    container_name: cinelog_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: cinelog_user
      DB_PASSWORD: cinelog_pass
      DB_NAME: cinelog
      SECRET_KEY: cinelog-super-secret-key-2024
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: cinelog_frontend
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - backend

volumes:
  mysql_data:
